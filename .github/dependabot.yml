version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    # Los PRs van a develop; main solo recibe releases.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    # Los PRs van a develop; main solo recibe releases.
    target-branch: develop
    schedule:
      interval: weekly
